name: Render Pria Kapak

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - utama

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependensi sistem Linux untuk Chromium & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 || sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install paket npm
        run: npm ci

      - name: Render komposisi Babak1
        run: |
          mkdir -p out
          npx remotion render Babak1 out/pria-kapak.mp4 --codec=h264

      - name: Upload hasil MP4 sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: pria-kapak-mp4
          path: out/pria-kapak.mp4
          retention-days: 7
